<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romix Flappy Bird</title>
    <link rel="stylesheet" href="flappy.css">
</head>
<body>

<div class="game">
    <h1>🐦 Romix Flappy</h1>
    <h3>👤 <span id="player">Player</span></h3>
    
    <div class="stats">
        <div>⭐ Ұпай: <span id="score">0</span></div>
        <div>🏆 Рекорд: <span id="best">0</span></div>
    </div>

    <canvas id="flappyCanvas" width="320" height="400"></canvas>

    <div id="message">
        <h2>Ойын аяқталды!</h2>
        <p>Ұпайың: <span id="final-score">0</span></p>
        <button onclick="restartGame()">Қайта ойнау</button>
        <button onclick="goHome()">Басты бет</button>
    </div>

    <p class="hint">Экранды түртіп құсты ұшыр!</p>
</div>

<script src="flappy.js"></script>
</body>
</html>
