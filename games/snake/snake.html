<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Romix Snake</title>
    <link rel="stylesheet" href="snake.css">
</head>
<body>

<div class="game">
    <h1>🐍 Romix Snake</h1>

    <div class="stats">
        <div>👤 <span id="player">Player</span></div>
        <div>⭐ <span id="score">0</span></div>
        <div>🏆 <span id="best">0</span></div>
        <div>❤️ <span id="life">3</span></div>
        <div>🔥 <span id="level">1</span></div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div id="message">
        <h2>Game Over</h2>
        <p>Ұпай: <span id="final">0</span></p>
        <button onclick="restartGame()">Қайта ойнау</button>
        <button onclick="goHome()">Басты бет</button>
    </div>

    <div class="control">
        <button onclick="changeDirection('UP')">⬆️</button>
        <br>
        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>
</div>

<script src="snake.js"></script>
</body>
</html>
